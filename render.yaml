# Render Free + Neon PostgreSQL. Il server non salva dati clienti su disco effimero.
services:
  - type: web
    name: goldbet-piedimonte-gestionale
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python -m compileall -q server.py storage.py
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: GB_SECURE_COOKIE
        value: '1'
      - key: GB_PUBLIC
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: GB_SETUP_TOKEN
        sync: false