name: Test gestionale
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica sintassi Python
        run: python -m py_compile server.py storage.py
      - name: Esegui test casse e accessi
        run: python -m unittest discover -s tests -v